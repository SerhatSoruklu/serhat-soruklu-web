name: Xanitizer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  XANITIZER_LICENSE_SECRET: XANITIZER_LICENSE

jobs:
  xanitizer:
    name: Xanitizer security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check Xanitizer secrets
        id: xanitizer-config
        env:
          XANITIZER_LICENSE_VALUE: ${{ secrets[env.XANITIZER_LICENSE_SECRET] }}
        run: |
          if [ -n "$XANITIZER_LICENSE_VALUE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Xanitizer skipped: configure the XANITIZER_LICENSE GitHub Actions secret to enable analysis."
          fi

      - name: Checkout repository
        if: steps.xanitizer-config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.xanitizer-config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        if: steps.xanitizer-config.outputs.configured == 'true'
        run: npm ci
        working-directory: frontend

      - name: Install backend dependencies
        if: steps.xanitizer-config.outputs.configured == 'true'
        run: npm ci
        working-directory: backend

      - name: Run Xanitizer analysis
        if: steps.xanitizer-config.outputs.configured == 'true'
        uses: RIGS-IT/xanitizer-action@v1
        with:
          license: ${{ secrets[env.XANITIZER_LICENSE_SECRET] }}

      - name: Upload Xanitizer SARIF
        if: steps.xanitizer-config.outputs.configured == 'true' && hashFiles('Xanitizer-Findings-List.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: Xanitizer-Findings-List.sarif
