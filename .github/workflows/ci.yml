name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-candidate:
    name: Release candidate gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate isolated production infrastructure
        run: bash ops/validate-infrastructure.sh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Install application dependencies from lockfiles
        run: npm run install:projects

      - name: Install Playwright browsers and host dependencies
        run: npm --prefix frontend run e2e:install -- --with-deps chromium firefox webkit

      - name: Lint
        run: npm run lint

      - name: Type and syntax checks
        run: npm run check

      - name: Frontend and backend unit tests
        run: npm test

      - name: Production dependency audit policy
        run: npm run audit:production

      - name: Browser end-to-end tests
        run: npm run e2e

      - name: Firefox and WebKit route smoke tests
        run: npm run e2e:smoke:cross-browser

      - name: Build final production artifact
        run: npm run build:production

      - name: Assert final production artifact
        run: npm run assert:production

      - name: Smoke-test production SSR artifact
        run: npm run smoke:production

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@v4
        with:
          name: serhatsoruklu-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            package.json
            package-lock.json
            README.md
            frontend/dist/frontend/
            frontend/package.json
            frontend/package-lock.json
            frontend/scripts/start-production.mjs
            frontend/public/favicon.ico
            frontend/public/assets/brand/favicons/web-app-manifest-192x192.png
            backend/.env.example
            backend/README.md
            backend/assets/
            backend/emails/
            backend/templates/
            backend/contact.js
            backend/server.js
            backend/package.json
            backend/package-lock.json
