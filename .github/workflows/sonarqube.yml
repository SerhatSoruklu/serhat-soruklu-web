name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SONAR_HOST_URL_SECRET: SONAR_HOST_URL
  SONAR_ORGANIZATION_SECRET: SONAR_ORGANIZATION
  SONAR_PROJECT_KEY_SECRET: SONAR_PROJECT_KEY
  SONAR_TOKEN_SECRET: SONAR_TOKEN

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check SonarQube secrets
        id: sonar-config
        env:
          SONAR_HOST_URL_VALUE: ${{ secrets[env.SONAR_HOST_URL_SECRET] }}
          SONAR_ORGANIZATION_VALUE: ${{ secrets[env.SONAR_ORGANIZATION_SECRET] }}
          SONAR_PROJECT_KEY_VALUE: ${{ secrets[env.SONAR_PROJECT_KEY_SECRET] }}
          SONAR_TOKEN_VALUE: ${{ secrets[env.SONAR_TOKEN_SECRET] }}
        run: |
          if [ -n "$SONAR_TOKEN_VALUE" ] && [ -n "$SONAR_HOST_URL_VALUE" ] && [ -n "$SONAR_ORGANIZATION_VALUE" ] && [ -n "$SONAR_PROJECT_KEY_VALUE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube skipped: configure SONAR_TOKEN, SONAR_HOST_URL, SONAR_ORGANIZATION, and SONAR_PROJECT_KEY GitHub Actions secrets to enable analysis."
          fi

      - name: Checkout repository
        if: steps.sonar-config.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.sonar-config.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install workspace dependencies
        if: steps.sonar-config.outputs.configured == 'true'
        run: npm install

      - name: Lint project
        if: steps.sonar-config.outputs.configured == 'true'
        run: npm run lint

      - name: Build project
        if: steps.sonar-config.outputs.configured == 'true'
        run: npm run build

      - name: Run frontend coverage
        if: steps.sonar-config.outputs.configured == 'true'
        run: npm --prefix frontend test -- --watch=false --coverage

      - name: Run backend coverage
        if: steps.sonar-config.outputs.configured == 'true'
        run: npm --prefix backend run test:coverage

      - name: Run SonarQube scan
        if: steps.sonar-config.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        env:
          SONAR_HOST_URL: ${{ secrets[env.SONAR_HOST_URL_SECRET] }}
          SONAR_TOKEN: ${{ secrets[env.SONAR_TOKEN_SECRET] }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets[env.SONAR_PROJECT_KEY_SECRET] }}
            -Dsonar.organization=${{ secrets[env.SONAR_ORGANIZATION_SECRET] }}
            -Dsonar.sources=frontend/src,backend
            -Dsonar.tests=frontend/src,backend
            -Dsonar.test.inclusions=frontend/src/**/*.spec.ts,backend/**/*.test.js
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,frontend/src/**/*.spec.ts,backend/**/*.test.js
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info,backend/coverage/lcov.info
