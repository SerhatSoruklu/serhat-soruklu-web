<header
  class="mobile-header"
  [ngClass]="{
    'mobile-header--panel-open': menuOpen() || themeMenuOpen(),
    'mobile-header--scrolled': isScrolled()
  }"
  data-testid="mobile-header"
  [style.--scroll-progress]="scrollProgress()"
>
  <div class="mobile-header__bar">
    <a class="mobile-brand" routerLink="/" aria-label="Serhat Soruklu home" (click)="topNavigation.handleBrandClick(); closeMenu()">
      <span class="mobile-brand__mark">
        <img
          class="mobile-brand__logo mobile-brand__logo--dark"
          src="/assets/brand/logo/serhat_soruklu_s_dark_header.png"
          alt="Serhat Soruklu logo"
          width="36"
          height="36"
          loading="eager"
          decoding="async"
          data-testid="mobile-brand-logo-dark"
        >
        <img
          class="mobile-brand__logo mobile-brand__logo--light"
          src="/assets/brand/logo/serhat_soruklu_s_light_header.png"
          alt="Serhat Soruklu logo"
          width="36"
          height="36"
          loading="eager"
          decoding="async"
          data-testid="mobile-brand-logo-light"
        >
      </span>
      <span class="mobile-brand__text">
        <span class="mobile-brand__name">Serhat Soruklu</span>
        <span class="mobile-brand__subtitle">SYSTEMS ARCHITECT</span>
      </span>
    </a>

    <div class="mobile-header__actions">
      <div class="mobile-theme">
        <button
          class="mobile-header__icon-button"
          type="button"
          aria-label="Select theme"
          [attr.aria-expanded]="themeMenuOpen()"
          aria-haspopup="menu"
          [appTooltip]="themeService.themeTooltipText()"
          appTooltipPlacement="bottom"
          data-testid="mobile-theme-menu-button"
          (click)="toggleThemeMenu()"
        >
          <span class="menu-toggle" aria-hidden="true">
            <svg class="menu-toggle__icon theme-icon--dark" viewBox="0 0 24 24" focusable="false">
              <path [attr.d]="themeTriggerIconPaths.dark"></path>
            </svg>
            <svg class="menu-toggle__icon theme-icon--light" viewBox="0 0 24 24" focusable="false">
              <path [attr.d]="themeTriggerIconPaths.light"></path>
            </svg>
            <svg class="menu-toggle__icon theme-icon--system" viewBox="0 0 24 24" focusable="false">
              <path [attr.d]="themeTriggerIconPaths.system"></path>
            </svg>
          </span>
        </button>

        <div
          class="mobile-theme__menu"
          [ngClass]="{ 'mobile-theme__menu--open': themeMenuOpen() }"
          role="menu"
          aria-label="Theme options"
          data-testid="mobile-theme-menu"
          [attr.inert]="themeMenuOpen() ? null : ''"
        >
          @for (option of themeOptions; track option.value) {
            <button
              class="mobile-theme__option"
              [ngClass]="{ 'mobile-theme__option--active': themeService.setting() === option.value }"
              type="button"
              role="menuitemradio"
              [attr.aria-checked]="themeService.setting() === option.value"
              [attr.tabindex]="themeMenuOpen() ? 0 : -1"
              (click)="setTheme(option.value)"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path [attr.d]="option.iconPath"></path>
              </svg>
              <span>{{ option.label }}</span>
            </button>
          }
        </div>
      </div>

      <button
        class="mobile-header__icon-button menu-button"
        type="button"
        [attr.aria-label]="menuOpen() ? 'Close navigation' : 'Open navigation'"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-navigation"
        data-testid="mobile-menu-button"
        (click)="toggleMenu()"
      >
        <span class="menu-toggle" aria-hidden="true">
          <svg class="menu-toggle__icon menu-toggle__icon--open" viewBox="0 0 24 24" focusable="false">
            <path [attr.d]="menuIconPath"></path>
          </svg>
          <svg class="menu-toggle__icon menu-toggle__icon--close" viewBox="0 0 24 24" focusable="false">
            <path [attr.d]="closeIconPath"></path>
          </svg>
        </span>
      </button>
    </div>
  </div>

  <div class="mobile-header__scroll-progress" aria-hidden="true">
    <span class="mobile-header__scroll-progress-bar"></span>
  </div>

  <nav
    id="mobile-navigation"
    class="mobile-nav"
    [ngClass]="{ 'mobile-nav--open': menuOpen() }"
    aria-label="Mobile navigation"
    data-testid="mobile-nav-panel"
    [attr.inert]="menuOpen() ? null : ''"
  >
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="mobile-nav__link--active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        ariaCurrentWhenActive="page"
        class="mobile-nav__link"
        [attr.tabindex]="menuOpen() ? 0 : -1"
        (click)="topNavigation.handleLinkClick(item.path); closeMenu()"
      >
        <svg class="mobile-nav__icon" [ngClass]="{ 'mobile-nav__github-icon': item.iconClass === 'github-icon' }" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path [attr.d]="item.iconPath"></path>
        </svg>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</header>
