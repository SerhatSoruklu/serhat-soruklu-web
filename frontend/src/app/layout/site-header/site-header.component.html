<header
  class="site-header"
  [class.site-header--scrolled]="isScrolled()"
  data-testid="desktop-header"
  [style.--scroll-progress]="scrollProgress()"
>
  <div class="site-header__inner">
    <a
      class="site-brand"
      routerLink="/"
      aria-label="Serhat Soruklu home"
      (click)="topNavigation.handleBrandClick()"
    >
      <span class="site-brand__mark">
        <img
          class="site-brand__logo site-brand__logo--dark"
          src="/assets/brand/logo/serhat_soruklu_s_dark_header.png"
          alt="Serhat Soruklu logo"
          width="44"
          height="44"
          loading="eager"
          decoding="async"
          data-testid="desktop-brand-logo-dark"
        />
        <img
          class="site-brand__logo site-brand__logo--light"
          src="/assets/brand/logo/serhat_soruklu_s_light_header.png"
          alt="Serhat Soruklu logo"
          width="44"
          height="44"
          loading="eager"
          decoding="async"
          data-testid="desktop-brand-logo-light"
        />
      </span>
      <span class="site-brand__text">
        <span class="site-brand__name">Serhat Soruklu</span>
        <span class="site-brand__subtitle">SYSTEMS ARCHITECT</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Primary navigation">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="site-nav__link--active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          ariaCurrentWhenActive="page"
          class="site-nav__link"
          (click)="topNavigation.handleLinkClick(item.path)"
        >
          <svg
            class="site-nav__icon"
            [ngClass]="{ 'site-nav__github-icon': item.iconClass === 'github-icon' }"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path [attr.d]="item.iconPath"></path>
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="site-header__actions">
      <button
        class="language-trigger"
        type="button"
        aria-label="Language availability: 40 plus languages coming soon"
        aria-haspopup="dialog"
        appTooltip="40+ languages coming soon"
        appTooltipPlacement="bottom"
        data-testid="desktop-language-button"
        (click)="openLanguageDialog()"
      >
        <svg
          class="language-trigger__icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <path [attr.d]="languageIconPath"></path>
        </svg>
      </button>

      <div class="theme-selector">
        <button
          class="theme-selector__trigger"
          type="button"
          aria-label="Select theme"
          [attr.aria-expanded]="themeMenuOpen()"
          aria-haspopup="menu"
          [appTooltip]="themeService.themeTooltipText()"
          appTooltipPlacement="bottom"
          data-testid="desktop-theme-menu-button"
          (click)="toggleThemeMenu()"
        >
          <span class="theme-selector__trigger-icons" aria-hidden="true">
            <svg
              class="theme-selector__icon theme-selector__icon--dark"
              viewBox="0 0 24 24"
              focusable="false"
            >
              <path [attr.d]="themeTriggerIconPaths.dark"></path>
            </svg>
            <svg
              class="theme-selector__icon theme-selector__icon--light"
              viewBox="0 0 24 24"
              focusable="false"
            >
              <path [attr.d]="themeTriggerIconPaths.light"></path>
            </svg>
            <svg
              class="theme-selector__icon theme-selector__icon--system"
              viewBox="0 0 24 24"
              focusable="false"
            >
              <path [attr.d]="themeTriggerIconPaths.system"></path>
            </svg>
          </span>
        </button>

        @if (themeMenuOpen()) {
          <div class="theme-selector__menu" role="menu" aria-label="Theme options">
            @for (option of themeOptions; track option.value) {
              <button
                class="theme-selector__option"
                [ngClass]="{
                  'theme-selector__option--active': themeService.setting() === option.value,
                }"
                type="button"
                role="menuitemradio"
                [attr.aria-checked]="themeService.setting() === option.value"
                (click)="setTheme(option.value)"
              >
                <svg
                  class="theme-selector__option-icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path [attr.d]="option.iconPath"></path>
                </svg>
                <span>{{ option.label }}</span>
              </button>
            }
          </div>
        }
      </div>
    </div>
  </div>

  <div class="site-header__scroll-progress" aria-hidden="true">
    <span class="site-header__scroll-progress-bar"></span>
  </div>
</header>

<app-mobile-header />
