    <!-- Apply the saved theme before first paint without a render-blocking request. -->
    <script nonce="__CSP_NONCE__">
      (function () {
        'use strict';

        var browserGlobal = globalThis;
        var storageKey = 'serhatsoruklu-theme';
        var themeClasses = [
          'theme-dark',
          'theme-light',
          'theme-system',
          'theme-resolved-dark',
          'theme-resolved-light',
        ];
        var setting = 'dark';
        var resolvedTheme = 'dark';
        var storedSetting = null;

        function readCookie(name) {
          var prefix = name + '=';
          var cookies = document.cookie.split(';');

          for (var index = 0; index < cookies.length; index += 1) {
            var cookie = cookies[index].trim();

            if (cookie.indexOf(prefix) === 0) {
              return cookie.slice(prefix.length);
            }
          }

          return null;
        }

        try {
          storedSetting = browserGlobal.localStorage.getItem(storageKey);
        } catch (error) {
          if (browserGlobal.console && typeof browserGlobal.console.debug === 'function') {
            browserGlobal.console.debug('Stored theme preference is unavailable.', error);
          }
        }

        if (storedSetting !== 'dark' && storedSetting !== 'light' && storedSetting !== 'system') {
          storedSetting = readCookie(storageKey);
        }

        if (storedSetting === 'dark' || storedSetting === 'light' || storedSetting === 'system') {
          setting = storedSetting;
        }

        if (
          setting === 'light' ||
          (setting === 'system' &&
            browserGlobal.matchMedia &&
            browserGlobal.matchMedia('(prefers-color-scheme: light)').matches)
        ) {
          resolvedTheme = 'light';
        }

        function applyTheme(target) {
          if (!target) {
            return;
          }

          target.classList.remove.apply(target.classList, themeClasses);
          target.classList.add('theme-' + setting, 'theme-resolved-' + resolvedTheme);
          target.style.colorScheme = resolvedTheme;
        }

        applyTheme(document.documentElement);

        document.addEventListener(
          'DOMContentLoaded',
          function () {
            applyTheme(document.body);
          },
          { once: true },
        );

        var themeColor = document.querySelector('meta[name="theme-color"]');

        if (themeColor) {
          themeColor.setAttribute('content', resolvedTheme === 'light' ? '#ffffff' : '#07090d');
        }

        if (browserGlobal.location && browserGlobal.location.pathname === '/') {
          var portraitPreload = document.createElement('link');

          portraitPreload.rel = 'preload';
          portraitPreload.as = 'image';
          portraitPreload.href =
            resolvedTheme === 'light'
              ? '/assets/home/serhat-soruklu-founder-light.png'
              : '/assets/home/serhat-soruklu-founder-dark.png';
          portraitPreload.setAttribute('fetchpriority', 'high');
          document.head.appendChild(portraitPreload);
        }
      })();
    </script>

        var scheduleAnalytics = function () {

        } else {
